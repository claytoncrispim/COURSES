{% extends "base.html" %}

{% block content %}
    <div class="border rounded p-3">
        <h1 class="my-5">{{note.title}}</h1>        
        <p>{{note.text}}</p>
        <p># of Likes:</p>
        <p>{{note.likes}}</p>
    </div>

    <form method="POST" action="{% url 'notes.add_like' pk=note.id %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary my-5">Like</button>
    </form>

   
    <a href="{% url 'notes.list' %}" class="btn btn-secondary my-5">Back</a>
    <a href="{% url 'notes.update' pk=note.id %}" class="btn btn-secondary">Edit</a>
    <a href="{% url 'notes.delete' pk=note.id %}" class="btn btn-danger">Delete</a>
{% endblock %}
