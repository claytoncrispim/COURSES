{% extends "base.html" %}

{% block content %}
    <h1 class="my-5">These are your notes:</h1>

    <div class="row row-cols-3 g-2">
        {% for note in notes %}
        <div class="col">
            <div class="p-3 border rounded bg-light text-dark text-center h-100">                
                <a href="{% url 'notes.detail' pk=note.id %}" class="text-blue text-decoration-none">
                    <h3>{{ note.title }}</h3>
                </a>
                {{ note.text|truncatechars:10 }}
                <div class="mt-2">
                {% if note.is_public %}
                    <span class="badge bg-success">Public</span>
                {% else %}
                    <span class="badge bg-secondary">Private</span>
                {% endif %}
                </div>
         
                <!-- If the note belongs to the current user, show edit and delete buttons -->
                {% if note.user == request.user %}
                <div class="mt-2">
                    <!-- <a href="{% url 'notes.update' pk=note.id %}" class="btn btn-primary btn-sm">Edit</a>
                    <a href="{% url 'notes.delete' pk=note.id %}" class="btn btn-danger btn-sm">Delete</a> -->
                    <a href="{% url 'notes.share' pk=note.id %}" class="btn btn-info btn-sm">Share</a>
                </div>
                {% endif %}
            </div>
        </div>
        {% endfor %}
        
    </div>
{% endblock %}
